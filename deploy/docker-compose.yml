version: '3.9'

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: sep-v2-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-sep_v2_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/001_init_v2_schema.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 스키마 적용 단계 (기동 중 마이그레이션을 대체). 백엔드는 이게 끝나야 뜬다.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: sep-v2-migrate
    restart: "no"
    command: ["node", "dist/database/migrate.js"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sep_v2_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  # 백엔드 API 서버
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: sep-v2-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sep_v2_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
    ports:
      - "3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../backend/src:/app/src

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: sep-v2-network
