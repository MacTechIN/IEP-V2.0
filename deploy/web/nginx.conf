# 공통 location 설정을 두 server(HTTP/HTTPS)에서 사용
# (녹음 기능은 HTTPS 보안 컨텍스트에서만 마이크 접근 가능)
#
# **업스트림 이름을 변수로 넘긴다.** 이유:
#   proxy_pass 에 이름을 그대로 적으면 nginx 가 **기동 시 한 번만** 해석하고 IP 를 캐시한다.
#   백엔드 컨테이너를 재생성하면 IP 가 바뀌는데 nginx 는 옛 IP 를 계속 붙들어 502 를 낸다.
#   2026-08-08 에 실제로 이걸로 로그인이 막혔고, nginx 를 재시작해야만 풀렸다.
#   변수로 쓰면 매 요청마다 resolver 로 다시 찾으므로 백엔드를 몇 번을 재배포해도 따라간다.
# 127.0.0.11 은 도커 내장 DNS 다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v2/stream {
        set $sep_backend sep-v2-backend;
        proxy_pass http://$sep_backend:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # 장시간 스트림
    }

    location /api/ {
        set $sep_backend sep-v2-backend;
        proxy_pass http://$sep_backend:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v2/stream {
        set $sep_backend sep-v2-backend;
        proxy_pass http://$sep_backend:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # 장시간 스트림
    }

    location /api/ {
        set $sep_backend sep-v2-backend;
        proxy_pass http://$sep_backend:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
