# 한 시간에 한 번 서비스 상태를 보고 기록한다.
#
# 왜 필요한가
#   다른 사람들이 테스트하는 동안 무언가 조용히 망가지면, 그 사람이 알려 주기 전까지
#   아무도 모른다. 그리고 알려 줄 때쯤이면 **언제부터 그랬는지**를 알 수 없다.
#
# 왜 이 컴퓨터가 아니라 Actions 인가
#   테스트는 내 노트북이 꺼져 있을 때도 계속된다. 점검이 내 컴퓨터에 매여 있으면
#   정작 필요한 시간대(밤·주말)에 안 돈다.
#
# 준비 (한 번만) — 저장소 Settings → Secrets and variables → Actions
#   DATABASE_URL   DB 검사용 (이미 있다)
# 없어도 돈다 — 못 본 항목은 `skip` 으로 기록하고 상태를 `PART` 로 남긴다.
#
# 로그인은 **계정 없이** 본다. 없는 계정으로 로그인해 401 이 오는지 보면
# 인증 라우트·DB·거부 동작이 확인된다. 전용 계정을 만들고 비밀번호를 CI 에 두는
# 값이 나머지 하나(토큰 발급)에 값하지 않는다고 판단했다 (2026-08-15).

name: Health

on:
  schedule:
    # 매시 정각. Actions 예약은 늦게 도는 일이 흔하다 —
    # v1 유지보수 크론에서 30분 주기가 실측 72~151분이었다.
    # 정확한 간격이 목적이 아니라 "한동안 아무도 안 보는 일" 을 막는 것이므로 그대로 둔다.
    - cron: '0 * * * *'
  workflow_dispatch:

# 두 개가 겹쳐 돌면서 같은 로그 파일을 쓰지 않게 한다.
concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install --no-save pg@8

      - name: 점검
        id: run
        continue-on-error: true          # 실패해도 로그는 남겨야 한다
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTH_EMAIL: ${{ secrets.HEALTH_EMAIL }}
          HEALTH_PASSWORD: ${{ secrets.HEALTH_PASSWORD }}
        run: |
          set +e
          node worker/tools/healthcheck.js > /tmp/health.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/health.txt

      - name: 기록
        run: |
          MONTH=$(date -u +%Y-%m)
          LOG="docs/health/${MONTH}.log"
          mkdir -p docs/health
          cat /tmp/health.txt >> "$LOG"

          # **매시간 커밋하지 않는다.** 하루 24개면 진짜 커밋이 그 아래 묻힌다.
          # 규칙은 하나다: **상태가 달라졌을 때**, 그리고 6시간마다 한 번.
          #   달라졌다  — 나빠졌든 좋아졌든 그 순간이 알고 싶은 것이다
          #   6시간마다 — 아무 일 없었다는 것도 기록이다
          NOW=$(awk 'NR==1{print $3}' /tmp/health.txt)
          [ -n "$NOW" ] || NOW=$([ '${{ steps.run.outputs.code }}' = 0 ] && echo OK || echo DOWN)
          PREV=$(git log -1 --format=%s -- "$LOG" 2>/dev/null | grep -oE '(OK|PART|SLOW|DOWN)' | head -1 || true)

          case "$(date -u +%H)" in 00|06|12|18) KEEP=1 ;; *) KEEP=0 ;; esac
          [ "$NOW" = "$PREV" ] || KEEP=1

          if [ "$KEEP" = 0 ]; then
            echo "$NOW · 그대로 · 커밋 생략"
            exit 0
          fi
          STATUS=$NOW
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$LOG"
          git diff --cached --quiet && exit 0
          # 커밋을 쌓지 않으려면 pull --rebase 가 필요하다 — 그 사이 다른 커밋이 들어올 수 있다.
          git commit -m "chore(health): ${STATUS} $(date -u +'%Y-%m-%d %H:%M')Z [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: 실패면 이 실행도 실패로
        # 로그를 남긴 뒤에 실패시킨다 — GitHub 이 이걸로 알림을 보낸다.
        if: steps.run.outputs.code != '0'
        run: |
          echo "::error::서비스 점검 실패 — docs/health/ 의 최근 줄을 보세요"
          exit 1
